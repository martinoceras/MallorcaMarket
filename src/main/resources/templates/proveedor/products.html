<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Gestió d'Inventari - MallorcaMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .table-container { border-radius: 12px; overflow: hidden; background: white; }
        .product-hidden { opacity: 0.6; background-color: #f8f9fa; }
        .table thead { background-color: #d1e7ff; color: #000; }
        .btn-edit { background-color: #ffc107; border: none; color: black; }
        .btn-edit:hover { background-color: #e0a800; }
        .input-group-text { background-color: #f8f9fa; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">MallorcaMarket</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="/"> <i class="bi bi-house-door"></i> Inici</a></li>
                <li class="nav-item"><a class="nav-link text-warning fw-bold active" href="/proveedor/products"> <i class="bi bi-box-seam"></i> La meva Botiga</a></li>
                <li class="nav-item"><a class="nav-link text-info fw-bold" href="/proveedor/orders"> <i class="bi bi-receipt"></i> Vendes Rebudes</a></li>
                <li class="nav-item ms-lg-3">
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button class="btn btn-danger btn-sm" type="submit">Sortir</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Gestió del meu Inventari</h2>
            <p class="text-muted small">Actualitza els teus productes locals per a la venda.</p>
        </div>
        <a th:href="@{/proveedor/products/new}" class="btn btn-success shadow-sm" style="background-color: #198754;">
            <i class="bi bi-plus-lg me-2"></i>Nou Producte
        </a>
    </div>

    <div class="card shadow-sm border-0 mb-5 table-container">
        <table class="table align-middle mb-0">
            <thead>
            <tr>
                <th class="ps-4">Producte</th>
                <th>Visibilitat</th>
                <th>Preu i Estoc</th>
                <th class="text-end pe-4">Accions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${productos}" th:if="${p.activo ?: true}" th:classappend="${!(p.visible ?: true)} ? 'product-hidden' : ''">
                <td class="ps-4 py-3" style="width: 40%;">
                    <div class="d-flex align-items-center">
                        <img th:src="${p.imageUrl != null ? p.imageUrl : 'https://placehold.co/50x50'}" class="rounded me-3" style="width: 50px; height: 50px; object-fit: cover;">
                        <div>
                            <div class="fw-bold" th:text="${p.nombre}">Nom</div>
                            <small class="text-muted" th:text="'Ref: #' + ${p.id}"></small>
                        </div>
                    </div>
                </td>

                <td>
                    <form th:action="@{/proveedor/products/toggle-visible/{id}(id=${p.id})}" method="post" class="m-0 d-inline">
                        <button type="submit" th:class="${p.visible ?: true} ? 'btn btn-sm btn-success shadow-sm' : 'btn btn-sm btn-outline-secondary shadow-sm'">
                            <i th:class="${p.visible ?: true} ? 'bi bi-eye-fill me-1' : 'bi bi-eye-slash-fill me-1'"></i>
                            <span th:text="${p.visible ?: true} ? 'Públic' : 'Privat'"></span>
                        </button>
                    </form>
                </td>

                <td style="width: 300px;">
                    <form th:id="'form-update-' + ${p.id}" th:action="@{/proveedor/products/update}" method="post" class="d-flex align-items-center">
                        <input type="hidden" name="id" th:value="${p.id}">
                        <div class="input-group input-group-sm me-2" style="width: 110px;">
                            <input type="number" step="0.01" name="precio" th:value="${p.precio}" class="form-control text-end">
                            <span class="input-group-text">€</span>
                        </div>
                        <div class="input-group input-group-sm" style="width: 90px;">
                            <input type="number" name="stock" th:value="${p.stock}" class="form-control text-end">
                            <span class="input-group-text"><i class="bi bi-box"></i></span>
                        </div>
                    </form>
                </td>

                <td class="text-end pe-4">
                    <div class="d-inline-flex gap-1">
                        <button th:form="'form-update-' + ${p.id}" type="submit" class="btn btn-primary btn-sm shadow-sm">
                            <i class="bi bi-download"></i>
                        </button>

                        <a th:href="@{/proveedor/products/edit/{id}(id=${p.id})}" class="btn btn-edit btn-sm shadow-sm">
                            <i class="bi bi-pencil-fill"></i>
                        </a>

                        <form th:action="@{/proveedor/products/delete/{id}(id=${p.id})}" method="post" class="m-0">
                            <button type="submit" class="btn btn-danger btn-sm shadow-sm" onclick="return confirm('Segur?')">
                                <i class="bi bi-trash-fill"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <h4 class="mb-3 fw-bold text-danger"><i class="bi bi-trash3-fill me-2"></i>Paperera</h4>
    <div class="card shadow-sm border-0 bg-white mb-5" style="border-radius: 12px; border-left: 5px solid #dc3545 !important;">
        <table class="table align-middle mb-0">
            <tbody>
            <tr th:each="p : ${productos}" th:if="${!(p.activo ?: true)}">
                <td class="ps-4 text-muted py-3">
                    <i class="bi bi-file-earmark-x me-2"></i>
                    <span class="fw-bold" th:text="${p.nombre}"></span>
                </td>
                <td class="text-end pe-4">
                    <div class="d-inline-flex gap-2">
                        <a th:href="@{/proveedor/products/restore/{id}(id=${p.id})}" class="btn btn-sm btn-outline-success">
                            <i class="bi bi-arrow-counterclockwise"></i> Restaurar
                        </a>
                        <form th:action="@{/proveedor/products/permanent-delete/{id}(id=${p.id})}" method="post" class="m-0 d-inline" onsubmit="return confirm('Aquesta acció és irreversible. Segur que vols eliminar permanentment aquest producte?');">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash-fill"></i> Eliminar
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(productos.?[!(activo ?: true)])}">
                <td class="text-center py-4 text-muted small">La paperera està buida.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
