<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Proveïdor - MallorcaMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-shop me-2"></i>MallorcaMarket <span class="badge bg-white text-primary ms-2">PROVEÏDOR</span>
        </a>
        <div class="navbar-nav ms-auto">
            <a th:href="@{/}" class="btn btn-sm btn-outline-light">
                <i class="bi bi-arrow-left"></i> Tornar a la botiga
            </a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Gestió del meu Inventari</h2>
            <p class="text-muted">Actualitza preus i estoc, o gestiona els detalls dels teus productes.</p>
        </div>
        <a th:href="@{/proveedor/products/new}" class="btn btn-success shadow-sm">
            <i class="bi bi-plus-lg me-2"></i>Nou Producte
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${success}">Missatge d'èxit</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0 overflow-hidden" style="border-radius: 15px;">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-primary text-white">
            <tr>
                <th class="ps-4">Producte</th>
                <th>Preu (€)</th>
                <th>Estoc</th>
                <th class="text-center">Accions de Gestió</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${productos}">
                <form th:action="@{/proveedor/products/update}" method="post">
                    <input type="hidden" name="id" th:value="${p.id}">
                    <input type="hidden" name="nombre" th:value="${p.nombre}">

                    <td class="ps-4">
                        <div class="d-flex align-items-center">
                            <img th:src="${p.imageUrl != null ? p.imageUrl : 'https://placehold.co/50x50?text=IMG'}"
                                 class="rounded me-3" width="50" height="50" alt="img">
                            <div>
                                <span th:text="${p.nombre}" class="fw-bold d-block"></span>
                                <small class="text-muted" th:text="'Ref: #' + ${p.id}"></small>
                            </div>
                        </div>
                    </td>

                    <td>
                        <div class="input-group input-group-sm" style="width: 120px;">
                            <input type="number" step="0.01" name="precio" th:value="${p.precio}"
                                   class="form-control" required>
                            <span class="input-group-text">€</span>
                        </div>
                    </td>

                    <td>
                        <div class="d-flex align-items-center">
                            <input type="number" name="stock" th:value="${p.stock}"
                                   class="form-control form-control-sm me-2" style="width: 70px;" required>
                            <i th:if="${p.stock <= 5}" class="bi bi-exclamation-triangle-fill text-warning"
                               title="Estoc baix!"></i>
                        </div>
                    </td>

                    <td class="text-center pe-4">
                        <div class="btn-group shadow-sm">
                            <button type="submit" class="btn btn-primary btn-sm" title="Guardar canvis ràpids">
                                <i class="bi bi-save"></i>
                            </button>

                            <a th:href="@{/proveedor/products/edit/{id}(id=${p.id})}"
                               class="btn btn-warning btn-sm" title="Editar informació completa">
                                <i class="bi bi-pencil-square"></i>
                            </a>

                            <a th:href="@{/proveedor/products/delete/{id}(id=${p.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Estàs segur que vols donar de baixa aquest producte? No apareixerà a la botiga.')"
                               title="Donar de baixa">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    </td>
                </form>
            </tr>

            <tr th:if="${#lists.isEmpty(productos)}">
                <td colspan="4" class="text-center py-5 text-muted">
                    <i class="bi bi-info-circle fs-2 d-block mb-2"></i>
                    Encara no tens cap producte a la venda.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
