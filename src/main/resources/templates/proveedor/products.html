<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Gestió d'Inventari - MallorcaMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .table-container { border-radius: 15px; overflow: hidden; }
        .product-hidden { opacity: 0.6; background-color: #f8f9fa; }
        .nav-link:hover { color: #ffc107 !important; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">MallorcaMarket</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link active" href="/"><i class="bi bi-house-door"></i> Inici</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('PROVIDER')">
                    <a class="nav-link text-warning fw-bold" href="/proveedor/products">
                        <i class="bi bi-box-seam"></i> La meva Botiga
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('PROVIDER')">
                    <a class="nav-link text-info fw-bold" href="/proveedor/orders">
                        <i class="bi bi-receipt"></i> Vendes Rebudes
                    </a>
                </li>

                <li class="nav-item ms-lg-3" sec:authorize="hasRole('CLIENT')">
                    <a class="btn btn-outline-light position-relative" href="/cart">
                        <i class="bi bi-cart3"></i> Carrito
                    </a>
                </li>

                <li class="nav-item ms-lg-3">
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button class="btn btn-danger btn-sm" type="submit">Sortir</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Gestió del meu Inventari</h2>
            <p class="text-muted">Actualitza els teus productes locals per a la venda.</p>
        </div>
        <a th:href="@{/proveedor/products/new}" class="btn btn-success shadow-sm">
            <i class="bi bi-plus-lg me-2"></i>Nou Producte
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${success}">Operació realitzada</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0 mb-5 table-container">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-primary text-white">
            <tr>
                <th class="ps-4">Producte</th>
                <th>Visibilitat</th>
                <th>Preu i Estoc</th>
                <th class="text-center">Accions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${productos}" th:if="${p.activo ?: true}"
                th:classappend="${!(p.visible ?: true)} ? 'product-hidden' : ''">
                <form th:action="@{/proveedor/products/update}" method="post">
                    <input type="hidden" name="id" th:value="${p.id}">
                    <td class="ps-4">
                        <div class="d-flex align-items-center">
                            <img th:src="${p.imageUrl != null ? p.imageUrl : 'https://placehold.co/50x50'}"
                                 class="rounded me-3 shadow-sm" width="50" height="50" style="object-fit: cover;">
                            <div>
                                <span th:text="${p.nombre}" class="fw-bold d-block"></span>
                                <small class="text-muted" th:text="'Ref: #' + ${p.id}"></small>
                            </div>
                        </div>
                    </td>
                    <td>
                        <a th:href="@{/proveedor/products/toggle-visible/{id}(id=${p.id})}" class="btn btn-sm shadow-sm"
                           th:classappend="${p.visible ?: true} ? 'btn-light text-success' : 'btn-secondary text-white'">
                            <i th:class="${p.visible ?: true} ? 'bi bi-eye-fill' : 'bi bi-eye-slash-fill'"></i>
                            <span th:text="${p.visible ?: true} ? ' Públic' : ' Ocult'"></span>
                        </a>
                    </td>
                    <td>
                        <div class="d-flex gap-2">
                            <div class="input-group input-group-sm" style="width: 100px;">
                                <input type="number" step="0.01" name="precio" th:value="${p.precio}" class="form-control" required>
                                <span class="input-group-text">€</span>
                            </div>
                            <div class="input-group input-group-sm" style="width: 90px;">
                                <input type="number" name="stock" th:value="${p.stock}" class="form-control" required>
                                <span class="input-group-text"><i class="bi bi-box"></i></span>
                            </div>
                        </div>
                    </td>
                    <td class="text-center pe-4">
                        <div class="btn-group">
                            <button type="submit" class="btn btn-primary btn-sm" title="Guardar canvis ràpids">
                                <i class="bi bi-save"></i>
                            </button>
                            <a th:href="@{/proveedor/products/edit/{id}(id=${p.id})}" class="btn btn-warning btn-sm">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/proveedor/products/delete/{id}(id=${p.id})}" class="btn btn-danger btn-sm"
                               onclick="return confirm('Segur que vols moure aquest producte a la paperera?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    </td>
                </form>
            </tr>
            </tbody>
        </table>
    </div>

    <h4 class="mb-3 fw-bold text-danger"><i class="bi bi-trash3-fill me-2"></i>Paperera</h4>
    <div class="card shadow-sm border-0 bg-white mb-5" style="border-radius: 12px; border-left: 5px solid #dc3545 !important;">
        <table class="table align-middle mb-0">
            <tbody>
            <tr th:each="p : ${productos}" th:if="${!(p.activo ?: true)}">
                <td class="ps-4 text-muted">
                    <i class="bi bi-file-earmark-x me-2"></i>
                    <span class="fw-bold" th:text="${p.nombre}"></span>
                </td>
                <td class="text-end pe-4">
                    <a th:href="@{/proveedor/products/restore/{id}(id=${p.id})}" class="btn btn-sm btn-outline-success">
                        <i class="bi bi-arrow-counterclockwise"></i> Restaurar
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(productos.?[!(activo ?: true)])}">
                <td class="text-center py-4 text-muted small">La paperera està buida.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
