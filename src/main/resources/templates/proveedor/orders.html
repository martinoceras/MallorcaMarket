<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Vendes Rebudes - MallorcaMarket PRO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2 class="mb-4 text-primary font-monospace border-bottom pb-2">📦 Gestió de Vendes Rebudes</h2>

  <div th:if="${#lists.isEmpty(comandes)}" class="alert alert-info border-0 shadow-sm">
    No s'ha trobat cap comanda amb els teus productes.
  </div>

  <div th:each="c : ${comandes}" class="card mb-4 shadow-sm border-0">
    <div class="card-header bg-dark text-white d-flex justify-content-between">
      <span>COMANDA <span th:text="'#' + ${c.id}">#1</span></span>
      <span th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy HH:mm')}">Data</span>
    </div>
    <div class="card-body">
      <div class="row mb-3">
        <div class="col-md-6">
          <p class="mb-1 text-muted small uppercase">CLIENT</p>
          <h6 th:text="${c.usuario.nombre}">Nom Client</h6>
          <p class="text-primary small" th:text="${c.usuario.email}">email@client.com</p>
        </div>
        <div class="col-md-6 text-md-end">
          <span class="badge bg-info text-dark" th:text="${c.estado}">ESTAT</span>
        </div>
      </div>

      <table class="table table-sm">
        <thead class="table-light">
        <tr>
          <th>Producte</th>
          <th class="text-center">Quantitat</th>
          <th class="text-end">Preu Unit.</th>
          <th class="text-end">Subtotal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="linea : ${c.lineas}">
          <td th:text="${linea.producto.nombre}">Oli de Mallorca</td>
          <td class="text-center" th:text="${linea.cantidad}">1</td>
          <td class="text-end" th:text="${linea.precioUnitario} + ' €'">10.00 €</td>
          <td class="text-end fw-bold" th:text="${linea.precioUnitario * linea.cantidad} + ' €'">10.00 €</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
