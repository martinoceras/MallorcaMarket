<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Formulari de Producte - MallorcaMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow border-0">
        <div class="card-header bg-dark text-white py-3">
          <h4 class="mb-0" th:text="${producto.id == null ? 'Nou Producte' : 'Editar Producte'}"></h4>
        </div>
        <div class="card-body p-4">
          <form th:action="@{/proveedor/products/save}" th:object="${producto}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
              <label class="form-label fw-bold">Nom del Producte</label>
              <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ex: Sobrassada artesana">
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Descripció</label>
              <textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Preu (€)</label>
                <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Estoc Inicial</label>
                <input type="number" th:field="*{stock}" class="form-control" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">URL de la Imatge</label>
              <input type="url" th:field="*{imageUrl}" class="form-control" placeholder="https://...">
            </div>

            <div class="d-flex justify-content-between mt-4">
              <a th:href="@{/proveedor/products}" class="btn btn-outline-secondary">Cancel·lar</a>
              <button type="submit" class="btn btn-success px-4">Desar Producte</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
