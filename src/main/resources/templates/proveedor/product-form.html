<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Nou Producte - MallorcaMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white fw-bold">
          <i class="bi bi-plus-circle me-2"></i> Afegir Nou Producte
        </div>
        <div class="card-body p-4">
          <form th:action="@{/proveedor/products/save}" th:object="${producto}" method="post">
              <input type="hidden" th:field="*{id}">

              <div class="mb-3">
                <label class="form-label">Nom del Producte</label>
                <input type="text" th:field="*{nombre}" class="form-control" required>
              </div>


            <div class="mb-3">
              <label class="form-label">Nom del Producte</label>
              <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ex: Sobrassada artesana" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Descripció</label>
              <textarea th:field="*{descripcion}" class="form-control" rows="3" placeholder="Explica les característiques del producte..."></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Preu (€)</label>
                <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Estoc Inicial</label>
                <input type="number" th:field="*{stock}" class="form-control" required>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label">URL de la Imatge (opcional)</label>
              <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="https://...">
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-success">Guardar Producte</button>
              <a th:href="@{/proveedor/products}" class="btn btn-outline-secondary">Cancel·lar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
