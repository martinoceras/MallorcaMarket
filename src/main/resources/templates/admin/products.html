<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Gestió de Productes - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-box-seam"></i> Inventari de Productes</h2>
    <a href="/" class="btn btn-outline-secondary btn-sm">Tornar a la Botiga</a>
  </div>

  <div class="card shadow border-0">
    <table class="table align-middle mb-0">
      <thead class="table-dark">
      <tr>
        <th>Producte</th>
        <th>Preu (€)</th>
        <th>Estoc</th>
        <th class="text-center">Acció</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="p : ${productos}">
        <form th:action="@{/admin/products/update}" method="post">
          <input type="hidden" name="id" th:value="${p.id}">
          <input type="hidden" name="nombre" th:value="${p.nombre}">
          <input type="hidden" name="descripcion" th:value="${p.descripcion}">

          <td th:text="${p.nombre}" class="fw-bold">Nom</td>
          <td>
            <input type="number" step="0.01" name="precio"
                   th:value="${p.precio}" class="form-control form-control-sm" style="width: 100px;">
          </td>
          <td>
            <input type="number" name="stock"
                   th:value="${p.stock}" class="form-control form-control-sm" style="width: 80px;">
          </td>
          <td class="text-center">
            <button type="submit" class="btn btn-sm btn-primary">
              <i class="bi bi-check-lg"></i> Actualitzar
            </button>
          </td>
        </form>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
