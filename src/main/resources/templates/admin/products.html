<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Gestió d'Inventari - MallorcaMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">MallorcaMarket <span class="badge bg-primary ms-2">ADMIN</span></a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" th:href="@{/admin/products}">
            <i class="bi bi-box-seam"></i> Gestión Productos
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/admin/users}">
            <i class="bi bi-people"></i> Gestión Usuarios
          </a>
        </li>
        <li class="nav-item ms-lg-3">
          <a class="btn btn-sm btn-outline-light mt-1" th:href="@{/}">Tornar a la Botiga</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
  <h2 class="fw-bold text-dark mb-3">Gestión de Productos</h2>
  <p class="text-muted mb-4">Modifica el preu i l'estoc dels productes en temps real.</p>

  <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm border-0 mb-4" role="alert">
    <i class="bi bi-check-circle-fill me-2"></i>
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="card shadow-sm border-0 overflow-hidden" style="border-radius: 12px;">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-dark">
      <tr>
        <th class="ps-4">Producte</th>
        <th>Preu (€)</th>
        <th>Estoc</th>
        <th class="text-center">Accions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="p : ${productos}">
        <form th:action="@{/admin/products/update}" method="post">
          <input type="hidden" name="id" th:value="${p.id}">
          <input type="hidden" name="nombre" th:value="${p.nombre}">
          <input type="hidden" name="descripcion" th:value="${p.descripcion}">

          <td class="ps-4">
            <span th:text="${p.nombre}" class="fw-bold d-block"></span>
            <small class="text-muted" th:text="'ID: ' + ${p.id}"></small>
          </td>
          <td>
            <input type="number" step="0.01" name="precio" th:value="${p.precio}" class="form-control form-control-sm" style="width: 110px;" required>
          </td>
          <td>
            <input type="number" name="stock" th:value="${p.stock}" class="form-control form-control-sm" style="width: 80px;" required>
          </td>
          <td class="text-center">
            <button type="submit" class="btn btn-primary btn-sm px-3">Guardar</button>
          </td>
        </form>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
