<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Panel d'Administració - MallorcaMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestió d'Usuaris (CU-05)</h2>
    <a href="/" class="btn btn-outline-secondary">Tornar a la Botiga</a>
  </div>

  <div class="card shadow border-0">
    <div class="card-body p-0">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Estat</th>
          <th class="text-center">Accions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
          <td th:text="${u.id}">1</td>
          <td th:text="${u.nombre}">Nom Usuari</td>
          <td th:text="${u.email}">email@exemple.com</td>
          <td th:text="${u.rol}">ROLE_CLIENT</td>
          <td>
                            <span th:class="${u.enabled} ? 'badge bg-success' : 'badge bg-danger'"
                                  th:text="${u.enabled} ? 'ACTIU' : 'INACTIU'">Estat</span>
          </td>
          <td class="text-center">
            <form th:action="@{/admin/users/toggle/{id}(id=${u.id})}" method="post">
              <button type="submit"
                      th:class="${u.enabled} ? 'btn btn-sm btn-danger' : 'btn btn-sm btn-success'"
                      th:text="${u.enabled} ? 'Desactivar' : 'Activar'">
              </button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

</body>
</html>
