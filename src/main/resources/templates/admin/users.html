<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Gestió d'Usuaris - MallorcaMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">MallorcaMarket <span class="badge bg-primary ms-2">ADMIN</span></a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/admin/products}">
            <i class="bi bi-box-seam"></i> Gestión Productos
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" th:href="@{/admin/users}">
            <i class="bi bi-people"></i> Gestión Usuarios
          </a>
        </li>
        <li class="nav-item ms-lg-3">
          <a class="btn btn-sm btn-outline-light mt-1" th:href="@{/}">Tornar a la Botiga</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
  <h2 class="fw-bold text-dark mb-4">Gestió d'Usuaris (CU-05)</h2>

  <div class="card shadow-sm border-0 overflow-hidden" style="border-radius: 12px;">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-dark">
      <tr>
        <th class="ps-4">ID</th>
        <th>Nom</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Estat</th>
        <th class="text-center">Accions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="u : ${usuarios}">
        <td class="ps-4" th:text="${u.id}"></td>
        <td th:text="${u.nombre}" class="fw-bold"></td>
        <td th:text="${u.email}"></td>
        <td><span class="badge bg-info text-dark" th:text="${u.rol}"></span></td>
        <td>
          <span th:if="${u.enabled}" class="badge bg-success">ACTIU</span>
          <span th:unless="${u.enabled}" class="badge bg-danger">INACTIU</span>
        </td>
        <td class="text-center pe-4">
          <form th:action="@{/admin/users/toggle/{id}(id=${u.id})}" method="post">
            <button type="submit" th:class="${u.enabled} ? 'btn btn-danger btn-sm' : 'btn btn-success btn-sm'"
                    th:text="${u.enabled} ? 'Desactivar' : 'Activar'"></button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
