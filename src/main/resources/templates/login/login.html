<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login - MallorcaMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="card mx-auto shadow" style="max-width: 400px;">
    <div class="card-body p-4">
      <h2 class="text-center mb-4">Entra a MallorcaMarket</h2>

      <div th:if="${param.error}" class="alert alert-danger">
        Usuari o contrasenya incorrectes.
      </div>
      <div th:if="${param.logout}" class="alert alert-info">
        Has tancat la sessió correctament.
      </div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label">Correu electrònic</label>
          <input type="text" name="username" class="form-control" placeholder="exemple@oli.cat" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Contrasenya</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Identificar-me</button>
      </form>

      <hr class="my-4">
      <p class="text-center">Ets nou? <a th:href="@{/register}">Crea un compte</a></p>
      <p class="text-center"><a th:href="@{/}">Tornar a la botiga</a></p>
    </div>
  </div>
</div>
</body>
</html>
