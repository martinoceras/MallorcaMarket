<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>MallorcaMarket - Inici</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">MallorcaMarket</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/orders/my-orders}">
                        <i class="bi bi-list-check"></i> Mis Pedidos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/cart}">
                        <i class="bi bi-cart"></i> Carrito
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Productes Locals de Mallorca</h2>

    <div class="row">
        <div class="col-md-6 mb-4" th:each="prod : ${productos}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${prod.nombre}">Nom del Producte</h5>
                    <p class="card-text" th:text="${prod.descripcion}">Descripció curta...</p>

                    <p class="card-text">
                        <small class="text-muted">
                            Estoc: <span th:text="${prod.stock}"
                                         th:classappend="${prod.stock < 5} ? 'text-danger fw-bold' : ''">0</span> unitats
                        </small>
                    </p>

                    <h5 class="text-primary" th:text="${prod.precio} + ' €'">0.00 €</h5>

                    <div th:if="${prod.stock > 0}">
                        <a th:href="@{/cart/add/{id}(id=${prod.id})}" class="btn btn-primary w-100">
                            Añadir al carrito
                        </a>
                    </div>
                    <div th:unless="${prod.stock > 0}">
                        <button class="btn btn-secondary w-100" disabled>Esgotat</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

        <div class="col-12" th:if="${#lists.isEmpty(productos)}">
            <div class="alert alert-info">Encara no hi ha productes disponibles.</div>
        </div>
    </div>
</div>

</body>
</html>
