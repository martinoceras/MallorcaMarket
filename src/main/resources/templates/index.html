<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>MallorcaMarket - Productes Locals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .product-card { transition: transform 0.2s; border: none; }
        .product-card:hover { transform: translateY(-5px); }
        .navbar-brand { font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-5">
    <div class="container">
        <a class="navbar-brand" href="/">MallorcaMarket</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link" href="/"><i class="bi bi-house-door"></i> Inici</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('PROVIDER')">
                    <a class="nav-link text-warning fw-bold" th:href="@{/proveedor/products}">
                        <i class="bi bi-shop"></i> La meva Botiga
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-info fw-bold" th:href="@{/admin/products}">
                        <i class="bi bi-shield-lock"></i> Admin
                    </a>
                </li>

                <li class="nav-item ms-lg-3">
                    <a class="btn btn-outline-light btn-sm position-relative" th:href="@{/cart}">
                        <i class="bi bi-cart3"></i> Carrito
                    </a>
                </li>

                <li class="nav-item ms-lg-3" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-primary btn-sm" th:href="@{/login}">Iniciar Sessió</a>
                </li>
                <li class="nav-item ms-lg-3" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-danger btn-sm">Sortir</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="fw-bold border-bottom pb-3">Productes Locals de Mallorca</h2>
            <p class="text-muted" sec:authorize="isAuthenticated()">
                Benvingut/da, <span class="fw-bold text-dark" th:text="${#authentication.name}">Usuari</span>
            </p>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="p : ${productos}">
            <div class="card h-100 shadow-sm product-card">
                <img th:src="${p.imageUrl != null ? p.imageUrl : 'https://placehold.co/400x250?text=MallorcaMarket'}"
                     class="card-img-top" alt="Producte">

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold" th:text="${p.nombre}">Nom Producte</h5>
                    <p class="card-text text-muted small mb-3" th:text="${p.descripcion}">Descripció breu.</p>

                    <div class="mt-auto">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="fs-4 fw-bold text-primary" th:text="${p.precio} + ' €'">0.00 €</span>
                            <span class="badge bg-light text-dark border">
                                Estoc: <span th:text="${p.stock}">0</span>
                            </span>
                        </div>

                        <div th:if="${p.proveedor != null and #authentication.name == p.proveedor.email}">
                            <a th:href="@{/proveedor/products}" class="btn btn-warning w-100 fw-bold shadow-sm">
                                <i class="bi bi-pencil-square me-2"></i>Gestionar Estoc
                            </a>
                        </div>

                        <div th:unless="${p.proveedor != null and #authentication.name == p.proveedor.email}">
                            <a th:href="@{/cart/add/{id}(id=${p.id})}" class="btn btn-primary w-100 fw-bold shadow-sm">
                                <i class="bi bi-cart-plus me-2"></i>Añadir al carrito
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
