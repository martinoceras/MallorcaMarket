<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Les meves comandes - MallorcaMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-bag-check"></i> El meu historial de comandes</h2>
    <a href="/" class="btn btn-outline-primary">Tornar a la botiga</a>
  </div>

  <div class="card shadow border-0 rounded-3">
    <div class="card-body p-4">
      <div th:if="${#lists.isEmpty(pedidos)}" class="text-center py-4">
        <p class="text-muted">Encara no has realitzat cap comanda.</p>
        <a href="/" class="btn btn-primary">Comença a comprar</a>
      </div>

      <table th:unless="${#lists.isEmpty(pedidos)}" class="table table-hover align-middle">
        <thead class="table-light">
        <tr>
          <th>ID Comanda</th>
          <th>Data</th>
          <th>Estat</th>
          <th class="text-end">Total</th>
          <th class="text-center">Detalls</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${pedidos}">
          <td th:text="'#' + ${p.id}" class="fw-bold">#1</td>
          <td th:text="${#temporals.format(p.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
          <td>
                            <span class="badge rounded-pill"
                                  th:classappend="${p.status == 'CONFIRMADO' ? 'bg-success' : 'bg-warning'}"
                                  th:text="${p.status}">ESTAT</span>
          </td>
          <td th:text="${p.total} + ' €'" class="text-end fw-bold">0.00 €</td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-secondary">Veure detalls</button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

</body>
</html>
