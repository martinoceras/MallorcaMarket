<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Les meves comandes - MallorcaMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}">MallorcaMarket</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavOrders">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNavOrders">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door"></i> Inici</a>
        </li>
        <li class="nav-item ms-lg-3" sec:authorize="isAuthenticated() and !hasRole('PROVIDER') and !hasRole('ADMIN')">
          <a class="nav-link active fw-bold text-success" th:href="@{/orders/my-orders}">
            <i class="bi bi-bag-fill"></i> LES MEVES COMPRES
          </a>
        </li>
        <li class="nav-item ms-lg-3" sec:authorize="isAuthenticated() and !hasRole('PROVIDER') and !hasRole('ADMIN')">
          <a class="btn btn-outline-light" th:href="@{/cart}">
            <i class="bi bi-cart3"></i> Cistella
          </a>
        </li>
        <li class="nav-item ms-lg-4" sec:authorize="isAuthenticated()">
          <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-danger btn-sm fw-bold" type="submit">Sortir</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-bag-check"></i> El meu historial de comandes</h2>
    <a th:href="@{/}" class="btn btn-outline-primary">Tornar a la botiga</a>
  </div>

  <div class="card shadow border-0 rounded-3">
    <div class="card-body p-4">

      <div th:if="${#lists.isEmpty(pedidos)}" class="text-center py-4">
        <p class="text-muted">Encara no has realitzat cap comanda.</p>
        <a th:href="@{/}" class="btn btn-primary">Comença a comprar</a>
      </div>

      <table th:unless="${#lists.isEmpty(pedidos)}" class="table table-hover align-middle">
        <thead class="table-light">
        <tr>
          <th>ID Comanda</th>
          <th>Data</th>
          <th>Estat</th>
          <th class="text-end">Total</th>
          <th class="text-center">Accions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${pedidos}">
          <td th:text="'#' + ${p.id}" class="fw-bold text-primary">#1</td>

          <td th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>

          <td>
            <span class="badge rounded-pill"
                  th:classappend="${p.estado == 'PENDENT' ? 'bg-warning text-dark' : 'bg-success'}"
                  th:text="${p.estado}">ESTAT</span>
          </td>

          <td th:text="${p.total} + ' €'" class="text-end fw-bold">0.00 €</td>

          <td class="text-center">
            <a th:href="@{/orders/details/{id}(id=${p.id})}" class="btn btn-sm btn-primary">
              <i class="bi bi-search"></i> Detalls
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
