<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Detalls de la Comanda - MallorcaMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-info-circle"></i> Detalls de la Comanda <span th:text="'#' + ${pedido.id}"></span></h2>
    <a th:href="@{/orders/my-orders}" class="btn btn-outline-secondary">Tornar al llistat</a>
  </div>

  <div class="row">
    <div class="col-md-4">
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
          <h5 class="card-title border-bottom pb-2">Informació</h5>
          <p><strong>Data:</strong> <span th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}"></span></p>
          <p><strong>Estat:</strong> <span class="badge bg-success" th:text="${pedido.estado}"></span></p>
          <p class="fs-4 fw-bold text-primary">Total: <span th:text="${pedido.total} + ' €'"></span></p>
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <div class="card shadow-sm border-0">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead class="table-light">
            <tr>
              <th>Producte</th>
              <th class="text-center">Quantitat</th>
              <th class="text-end">Preu Unit.</th>
              <th class="text-end">Subtotal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="linea : ${pedido.lineas}">
              <td>
                <div class="d-flex align-items-center">
                  <img th:src="${linea.producto.imageUrl}" alt="Producte" class="rounded me-3" style="width: 50px; height: 50px; object-fit: cover;">
                  <span class="fw-bold" th:text="${linea.producto.nombre}"></span>
                </div>
              </td>
              <td class="text-center" th:text="${linea.cantidad}">1</td>
              <td class="text-end" th:text="${linea.precioUnitario} + ' €'">0.00 €</td>
              <td class="text-end fw-bold" th:text="${linea.precioUnitario * linea.cantidad} + ' €'">0.00 €</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
