<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>La teva cistella - MallorcaMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">MallorcaMarket</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavCart">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavCart">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door"></i> Inici</a>
                </li>
                <li class="nav-item ms-lg-3" sec:authorize="isAuthenticated() and !hasRole('PROVIDER') and !hasRole('ADMIN')">
                    <a class="nav-link fw-bold text-success" th:href="@{/orders/my-orders}">
                        <i class="bi bi-bag-fill"></i> LES MEVES COMPRES
                    </a>
                </li>
                <li class="nav-item ms-lg-3" sec:authorize="isAuthenticated() and !hasRole('PROVIDER') and !hasRole('ADMIN')">
                    <a class="btn btn-outline-light active" th:href="@{/cart}">
                        <i class="bi bi-cart3"></i> Cistella
                    </a>
                </li>
                <li class="nav-item ms-lg-4" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button class="btn btn-danger btn-sm fw-bold" type="submit">Sortir</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4 fw-bold">La teva cistella de compra</h2>

    <div th:if="${not #lists.isEmpty(cart)}" class="row">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 mb-4">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-3">Producte</th>
                        <th>Preu</th>
                        <th class="text-center">Quantitat</th>
                        <th>Subtotal</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${cart}">
                        <td class="ps-3">
                            <div class="fw-bold" th:text="${item.producto.nombre}">Nom</div>
                            <div th:if="${item.producto.stock <= 5}" class="mt-1">
                                    <span class="badge bg-warning text-dark small" style="font-size: 0.7rem;">
                                        <i class="bi bi-exclamation-triangle"></i> Últimes <span th:text="${item.producto.stock}"></span> unitats!
                                    </span>
                            </div>
                        </td>
                        <td th:text="${item.precioUnitario} + ' €'"></td>

                        <td class="text-center">
                            <div class="d-flex justify-content-center align-items-center">
                                <a th:href="@{/cart/remove-one/{id}(id=${item.producto.id})}"
                                   class="btn btn-outline-secondary btn-sm px-2">
                                    <i class="bi bi-dash"></i>
                                </a>

                                <span class="mx-3 fw-bold fs-5" th:text="${item.cantidad}">1</span>

                                <a th:href="@{/cart/add-one/{id}(id=${item.producto.id})}"
                                   class="btn btn-outline-secondary btn-sm px-2"
                                   th:classappend="${item.cantidad >= item.producto.stock} ? 'disabled' : ''">
                                    <i class="bi bi-plus"></i>
                                </a>
                            </div>
                        </td>

                        <td class="fw-bold" th:text="${item.precioUnitario * item.cantidad} + ' €'"></td>

                        <td class="text-end pe-3">
                            <a th:href="@{/cart/remove/{id}(id=${item.producto.id})}" class="text-danger">
                                <i class="bi bi-trash fs-5"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm border-0 p-4">
                <h4 class="fw-bold">Resum</h4>
                <hr>
                <div class="d-flex justify-content-between mb-4">
                    <span class="fs-5">Total:</span>
                    <h3 class="text-primary fw-bold" th:text="${total} + ' €'">0.00 €</h3>
                </div>
                <form th:action="@{/orders/checkout}" method="post">
                    <button type="submit" class="btn btn-success w-100 py-3 fw-bold shadow-sm">
                        Confirmar Comanda <i class="bi bi-arrow-right-circle ms-2"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(cart)}" class="text-center py-5">
        <div class="card shadow-sm border-0 p-5">
            <i class="bi bi-cart-x fs-1 text-muted mb-3"></i>
            <h3>La teva cistella està buida.</h3>
            <p class="text-muted">Busca productes mallorquins i afegeix-los aquí.</p>
            <a href="/" class="btn btn-primary mt-3 px-5">Anar a la botiga</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
