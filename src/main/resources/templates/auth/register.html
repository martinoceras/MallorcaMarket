<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registre - MallorcaMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 450px;">
        <h2 class="text-center mb-4">Crea el teu compte</h2>
        <form th:action="@{/register}" th:object="${usuario}" method="post">
            <div class="mb-3">
                <label class="form-label">Nom complet</label>
                <input type="text" th:field="*{nombre}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Correu electrònic</label>
                <input type="email" th:field="*{email}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contrasenya</label>
                <input type="password" th:field="*{password}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Vols vendre o comprar?</label>
                <select th:field="*{rol}" class="form-select">
                    <option value="ROLE_CLIENT">Vull comprar (Client)</option>
                    <option value="ROLE_PROVIDER">Vull vendre (Proveïdor)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Registrar-me</button>
        </form>
        <p class="mt-3 text-center">Ja tens compte? <a href="/login">Entra aquí</a></p>
    </div>
</div>
</body>
</html>
